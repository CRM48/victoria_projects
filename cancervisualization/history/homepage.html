<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Know Cancer - Mohio Ki te Mate Pukupuku o Aotearoa</title>
    <!--using css--->
    <link rel="stylesheet" href="style/stylesHistory.css" />
    <!--using Google font--->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!--D3--->
    <script src="https://d3js.org/d3.v7.min.js"></script>
  </head>
  <body>
    <div id="header"></div>

    <main>
      <div
        style="
          width: 1280px;
          height: 705px;
          background-color: #fbd13d;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 6px;
        "
      >
        <div class="carousel">
          <div class="carousel-images" id="carousel">
            <img src="img/mainimg1.png" alt="Image 1" />
            <img src="img/mainimg2.png" alt="Image 2" />
            <img src="img/mainimg3.png" alt="Image 3" />
          </div>
        </div>
        <!--button class="carousel-btn prev" id="prevBtn">&#10094;</button>
        <button class="carousel-btn next" id="nextBtn">&#10095;</button-->
      </div>
      <script src="js/changeHomeImg.js"></script>
      <div class="colorBlockFrame">
        <div class="colorBlockInner" style="background-color: #ffc8dd">
          LOVE
        </div>
        <div class="colorBlockInner" style="background-color: #ffafcc">
          CARE
        </div>
        <div class="colorBlockInner" style="background-color: #bde0fe">
          SUPPORT
        </div>
      </div>
    </main>

    <div id="footer"></div>
    <script>
      async function loadContent(id, file) {
        const response = await fetch(file);
        const content = await response.text();
        document.getElementById(id).innerHTML = content;
      }

      loadContent("header", "header.html");
      loadContent("footer", "footer.html");
    </script>
  </body>
</html>
